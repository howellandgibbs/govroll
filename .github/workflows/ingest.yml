name: ingest

# Scheduled ingestion for govroll's legislative data pipeline.
#
# Why GitHub Actions (not Vercel cron):
#   Vercel Hobby caps cron at once-per-day. GitHub Actions cron is free,
#   has no frequency limit (min 5 min), and has its own run history.
#   Each schedule below pings one idempotent endpoint on govroll.com.
#
# Setup (one-time):
#   1. Repo secret:   CRON_SECRET       — matches env var on Vercel
#   2. Repo variable: GOVROLL_BASE_URL  — e.g. https://govroll.com
#                                         (no trailing slash)
#
# Manual trigger: use the "Run workflow" button on the Actions tab —
# choose the endpoint from the dropdown to invoke it on demand.

on:
  schedule:
    # Times are UTC. Hobby cron would drift ±59min; GH Actions cron
    # is usually within a few minutes of the scheduled time but can be
    # delayed under heavy GitHub load. Don't design anything that needs
    # sub-15-min precision here — add overlap into the endpoint window.
    # compute-congress-status moved to its own workflow (congress-status.yml):
    # its */10 schedule collided with the crons below at :00/:20/:30/:50 and
    # GitHub coalesced the overlapping triggers, starving the status refresh.
    - cron: "10 * * * *" # fetch-votes                (hourly)
    - cron: "15 * * * *" # compute-momentum           (hourly)
    - cron: "45 * * * *" # backfill-bill-text         (hourly, small batch)
    # Was every 2h, bumped to every 30m, then relaxed to hourly to stay under
    # Vercel's free-tier Active CPU budget (each invocation pays cold-start CPU).
    # This cron reconciles currentStatus on top of the action backfill (Farm
    # Bill class of bugs). With ~5k live bills and batch=20 hourly, every live
    # bill gets refreshed every ~4 days while a chamber vote shows up in the DB
    # within a few hours of it happening.
    - cron: "5 * * * *" # backfill-bill-actions      (hourly)
    - cron: "40 */2 * * *" # backfill-cosponsors        (every 2h)
    - cron: "0 */3 * * *" # fetch-bills                (every 3h)
    # Was every 6h at :30, which both starved the drain (~100 bills/day against
    # a multi-thousand backlog of un-enriched bills — recent bills waited weeks
    # for a sponsor/summary) AND collided with fetch-votes at :30, where GitHub
    # coalesces same-minute triggers (see the header note). Hourly at the
    # collision-free :25 clears the gap in days; the script stops the batch
    # early on a 429 so the faster cadence can't exhaust the shared API key.
    - cron: "25 * * * *" # refresh-bill-metadata      (hourly at :25)
    - cron: "0 * * * *" # evaluate-budget            (hourly, on the hour)
    - cron: "0 10 * * 1" # fetch-representatives      (weekly, Mon 10:00 UTC)
    # embed-large-bills is paused (manual-only via workflow_dispatch). Its
    # embeddings only feed AI chat RAG, which has seen almost no use, yet the
    # chunks already fill ~2.5 GB of the 8 GB database (growing ~1 GB/month)
    # and each hourly run spends Vercel free-tier Active CPU. Re-enable at :20
    # once chat usage justifies it and the storage format is slimmed.
    - cron: "30 3 * * *" # cleanup-expired-cache      (daily 03:30 UTC)
    # Freshness watchdog — pages only when a cursor or backfill is genuinely
    # stuck for hours (sustained quota / a stopped cron / the #139 silent-stall
    # class), which the per-run quota stops deliberately no longer alert on.
    - cron: "55 * * * *" # ingest-health             (hourly at :55)

  workflow_dispatch:
    inputs:
      endpoint:
        description: "Which /api/cron/* endpoint to invoke"
        required: true
        type: choice
        options:
          - fetch-votes
          - compute-momentum
          - backfill-bill-text
          - backfill-bill-actions
          - backfill-cosponsors
          - fetch-bills
          - refresh-bill-metadata
          - evaluate-budget
          - fetch-representatives
          - embed-large-bills
          - cleanup-expired-cache
          - ingest-health
      since:
        description: "fetch-votes only — deep-backfill start date YYYY-MM-DD (optional)"
        required: false
        type: string

# The whole workflow doesn't need write scopes — we only call an
# authenticated HTTP endpoint on govroll.com.
permissions:
  contents: read

# Concurrency is keyed PER-JOB (on the `ping` job below), not at the workflow
# level. A workflow-level group can only read github.event.schedule (scheduled
# runs) or github.event.inputs.endpoint (manual runs) — two DIFFERENT keys for
# the same endpoint — so a workflow_dispatch could overlap a scheduled run of
# the same endpoint. Resolving the endpoint in its own job and keying the ping
# job's concurrency on that single resolved value closes the gap, with one
# source of truth for the schedule→endpoint mapping. Overlap is still allowed
# across DIFFERENT endpoints (each gets its own group); same-endpoint runs
# queue rather than overlap (the endpoints are idempotent, so this is just
# belt-and-suspenders against cursor regressions).

jobs:
  resolve:
    name: Resolve endpoint
    runs-on: ubuntu-latest
    timeout-minutes: 1
    outputs:
      endpoint: ${{ steps.route.outputs.endpoint }}
    steps:
      - name: Resolve endpoint
        id: route
        env:
          MANUAL_ENDPOINT: ${{ github.event.inputs.endpoint }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          set -euo pipefail
          if [ -n "${MANUAL_ENDPOINT:-}" ]; then
            echo "endpoint=${MANUAL_ENDPOINT}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          case "${SCHEDULE}" in
            "10 * * * *")    echo "endpoint=fetch-votes"               >> "$GITHUB_OUTPUT" ;;
            "15 * * * *")    echo "endpoint=compute-momentum"          >> "$GITHUB_OUTPUT" ;;
            "45 * * * *")    echo "endpoint=backfill-bill-text"        >> "$GITHUB_OUTPUT" ;;
            "5 * * * *")     echo "endpoint=backfill-bill-actions"     >> "$GITHUB_OUTPUT" ;;
            "40 */2 * * *")  echo "endpoint=backfill-cosponsors"       >> "$GITHUB_OUTPUT" ;;
            "0 */3 * * *")   echo "endpoint=fetch-bills"               >> "$GITHUB_OUTPUT" ;;
            "25 * * * *")    echo "endpoint=refresh-bill-metadata"     >> "$GITHUB_OUTPUT" ;;
            "0 * * * *")     echo "endpoint=evaluate-budget"           >> "$GITHUB_OUTPUT" ;;
            "0 10 * * 1")    echo "endpoint=fetch-representatives"     >> "$GITHUB_OUTPUT" ;;
            "30 3 * * *")    echo "endpoint=cleanup-expired-cache"     >> "$GITHUB_OUTPUT" ;;
            "55 * * * *")    echo "endpoint=ingest-health"             >> "$GITHUB_OUTPUT" ;;
            *)
              echo "::error::No endpoint mapped for schedule '${SCHEDULE}'"
              exit 1
              ;;
          esac

  ping:
    name: Invoke ingest endpoint
    needs: resolve
    runs-on: ubuntu-latest
    # Must exceed the curl --max-time below (310s). The previous 5m cap would
    # have killed the job at 300s — just before a legitimately-long fetch-bills
    # catch-up run returns — turning a successful 300s function into a red job.
    timeout-minutes: 7
    # Key BOTH scheduled and manual runs on the resolved endpoint so a
    # workflow_dispatch can't overlap a scheduled run of the same endpoint.
    concurrency:
      group: ingest-${{ needs.resolve.outputs.endpoint }}
      cancel-in-progress: false
    steps:
      - name: Validate configuration
        env:
          BASE_URL: ${{ vars.GOVROLL_BASE_URL }}
          SECRET: ${{ secrets.CRON_SECRET }}
          ENDPOINT: ${{ needs.resolve.outputs.endpoint }}
        run: |
          if [ -z "${BASE_URL:-}" ]; then
            echo "::error::Repo variable GOVROLL_BASE_URL is not set."
            exit 1
          fi
          if [ -z "${SECRET:-}" ]; then
            echo "::error::Repo secret CRON_SECRET is not set."
            exit 1
          fi
          # An empty endpoint means the resolve job's output didn't reach this
          # job (e.g. a steps.route vs needs.resolve mix-up). Fail with a clear
          # message instead of curling /api/cron/ and getting an opaque 404.
          if [ -z "${ENDPOINT:-}" ]; then
            echo "::error::Endpoint did not resolve (resolve job output empty)."
            exit 1
          fi

      - name: Invoke ${{ needs.resolve.outputs.endpoint }}
        env:
          BASE_URL: ${{ vars.GOVROLL_BASE_URL }}
          SECRET: ${{ secrets.CRON_SECRET }}
          ENDPOINT: ${{ needs.resolve.outputs.endpoint }}
          SINCE: ${{ github.event.inputs.since }}
        run: |
          set -euo pipefail
          URL="${BASE_URL%/}/api/cron/${ENDPOINT}"
          # Optional deep-backfill start for fetch-votes. The endpoint
          # validates the format and 400s on anything but YYYY-MM-DD.
          if [ -n "${SINCE:-}" ]; then
            if [ "${ENDPOINT}" = "fetch-votes" ]; then
              URL="${URL}?since=${SINCE}"
            else
              echo "::warning::'since' only applies to fetch-votes; ignoring for ${ENDPOINT}"
            fi
          fi
          echo "Calling $URL"

          # --fail-with-body so non-2xx responses still print the body.
          #
          # --max-time must cover the LONGEST function's maxDuration. The old
          # 65s cap dated from when every function was 60s; once fetch-bills and
          # embed-large-bills moved to 300s on Fluid Compute, 65s severed them
          # mid-run and reported a false curl(28) timeout (the function kept
          # working server-side, but the job went red). 310s == Vercel's 300s
          # platform ceiling + slack, so this caps the worst case without having
          # to track any single endpoint's maxDuration — it can't drift again.
          #
          # No --retry: a 504 means the function hit its OWN maxDuration cap, so
          # retrying just burns another budget for the same outcome. Endpoints
          # are idempotent — let the next scheduled run resume where we left off.
          http_code=$(
            curl --silent --show-error --fail-with-body \
              --max-time 310 \
              -H "Authorization: Bearer ${SECRET}" \
              -H "Accept: application/json" \
              -o response.json \
              -w "%{http_code}" \
              "$URL"
          )

          echo "HTTP $http_code"
          echo "--- body ---"
          cat response.json || true
          echo
          echo "--- end ---"

          # curl --fail-with-body exits non-zero on non-2xx, so reaching
          # here means success. Belt-and-suspenders status check anyway.
          if [ "${http_code}" -lt 200 ] || [ "${http_code}" -ge 300 ]; then
            echo "::error::Endpoint returned HTTP ${http_code}"
            exit 1
          fi
